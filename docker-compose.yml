services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - travel-agent-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  travel-agent-redis-data:
